<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 170" width="820" height="170" role="img" aria-label="Um evento percorrendo um pipeline serverless: App, API Gateway, Fila, Lambda, CRM">
  <defs>
    <style>
      .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #c9d1d9; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #6e7681; }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .conn { stroke: #30363d; stroke-width: 2; fill: none; }
      .flow { stroke: #1f6feb; stroke-width: 2; fill: none; stroke-dasharray: 5 11; opacity: .55; animation: dash 1.3s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -16; } }

      .packet { animation: travel 5s ease-in-out infinite; }
      @keyframes travel {
        0%   { transform: translate(0px,0);   opacity: 0; }
        6%   { opacity: 1; }
        94%  { opacity: 1; }
        100% { transform: translate(644px,0); opacity: 0; }
      }

      .n  { animation-duration: 5s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
      .n1 { animation-name: p1; } .n2 { animation-name: p2; }
      .n3 { animation-name: p3; } .n4 { animation-name: p4; } .n5 { animation-name: p5; }
      @keyframes p1 { 0%{stroke:#1f6feb} 10%,100%{stroke:#30363d} }
      @keyframes p2 { 0%,19%{stroke:#30363d} 25%{stroke:#1f6feb} 35%,100%{stroke:#30363d} }
      @keyframes p3 { 0%,44%{stroke:#30363d} 50%{stroke:#1f6feb} 60%,100%{stroke:#30363d} }
      @keyframes p4 { 0%,69%{stroke:#30363d} 75%{stroke:#1f6feb} 85%,100%{stroke:#30363d} }
      @keyframes p5 { 0%,88%{stroke:#30363d} 94%{stroke:#1f6feb} 100%{stroke:#30363d} }
    </style>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="169" rx="14" fill="#0d1117" stroke="#21262d"/>

  <line class="conn" x1="136" y1="85" x2="201" y2="85"/>
  <line class="conn" x1="297" y1="85" x2="362" y2="85"/>
  <line class="conn" x1="458" y1="85" x2="523" y2="85"/>
  <line class="conn" x1="619" y1="85" x2="684" y2="85"/>
  <line class="flow" x1="136" y1="85" x2="684" y2="85"/>

  <rect class="node n n1" x="40"  y="64" width="96" height="42" rx="8"/>
  <text class="lbl" x="88"  y="89" text-anchor="middle">App</text>
  <rect class="node n n2" x="201" y="64" width="96" height="42" rx="8"/>
  <text class="lbl" x="249" y="89" text-anchor="middle">API GW</text>
  <rect class="node n n3" x="362" y="64" width="96" height="42" rx="8"/>
  <text class="lbl" x="410" y="89" text-anchor="middle">Fila</text>
  <rect class="node n n4" x="523" y="64" width="96" height="42" rx="8"/>
  <text class="lbl" x="571" y="89" text-anchor="middle">Lambda</text>
  <rect class="node n n5" x="684" y="64" width="96" height="42" rx="8"/>
  <text class="lbl" x="732" y="89" text-anchor="middle">CRM</text>

  <g class="packet">
    <circle cx="88" cy="85" r="5" fill="#58a6ff" filter="url(#glow)"/>
  </g>

  <text class="sub" x="40"  y="139">event-driven · idempotente · trata falha (retry / DLQ)</text>
  <text class="sub" x="780" y="139" text-anchor="end">AWS · serverless</text>
</svg>
