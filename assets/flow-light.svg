<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" role="img" aria-label="Arquitetura serverless event-driven animada (preto e branco): um evento percorre webhook, API Gateway, fila SQS, Worker Lambda idempotente (DynamoDB, S3) e atualiza o CRM. Parte das mensagens falha e cai na DLQ com erro, depois é reprocessada. Um patinho observa o Worker (rubber duck debugging).">
  <defs>
    <style>
      .name  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1f2328; }
      .name2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px;   fill: #424a53; }
      .kick  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px;  fill: #818b98; letter-spacing: 2px; }
      .edge  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px;  fill: #57606a; }
      .cap   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px;    fill: #8b96a1; letter-spacing: 1px; }
      .errt  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px;   fill: #cf222e; letter-spacing: .5px; font-weight: 600; }
      .node  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .core  { fill: #ffffff; stroke: #24292f; stroke-width: 1.6; }
      .ico   { fill: none; stroke: #6e7781; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .icoc  { fill: none; stroke: #24292f; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .conn  { fill: none; stroke: #afb8c1; stroke-width: 1.6; }
      .dash  { fill: none; stroke: #afb8c1; stroke-width: 1.4; stroke-dasharray: 3 4; }

      .an { animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
      .pa { animation-name: kaL; } .ps { animation-name: ksL; } .pw { animation-name: kwL; } .pc { animation-name: kcL; }
      @keyframes kaL { 0%,6%{stroke:#d0d7de} 12%{stroke:#24292f} 20%,100%{stroke:#d0d7de} }
      @keyframes ksL { 0%,27%{stroke:#d0d7de} 33%{stroke:#24292f} 41%,100%{stroke:#d0d7de} }
      @keyframes kwL { 0%,48%{stroke:#24292f} 54%{stroke:#000000} 62%,100%{stroke:#24292f} }
      @keyframes kcL { 0%,90%{stroke:#d0d7de} 96%{stroke:#24292f} 100%{stroke:#d0d7de} }

      .packet { animation: travel 6s ease-in-out infinite; }
      @keyframes travel { 0%{transform:translate(0,0);opacity:0} 7%{opacity:1} 93%{opacity:1} 100%{transform:translate(660px,0);opacity:0} }

      .errpkt { animation: errdrop 6s ease-in-out infinite; }
      @keyframes errdrop { 0%,54%{opacity:0;transform:translate(0,0)} 59%{opacity:1;transform:translate(0,0)} 76%{opacity:1;transform:translate(0,50px)} 90%{opacity:1;transform:translate(0,50px)} 96%,100%{opacity:0;transform:translate(0,50px)} }
      .errx { animation: errpop 6s ease-in-out infinite; }
      @keyframes errpop { 0%,74%{opacity:0;transform:scale(.3)} 80%{opacity:1;transform:scale(1)} 92%{opacity:1;transform:scale(1)} 97%,100%{opacity:0;transform:scale(1)} }
      .errlbl { animation: errshow 6s ease-in-out infinite; }
      @keyframes errshow { 0%,76%{opacity:0} 82%{opacity:1} 93%,100%{opacity:0} }
      .dlqx { animation: dlqflashL 6s ease-in-out infinite; }
      @keyframes dlqflashL { 0%,74%{stroke:#d0d7de} 82%{stroke:#cf222e} 93%,100%{stroke:#d0d7de} }
    </style>
    <pattern id="gridL" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.9" fill="#e7ebf0"/></pattern>
    <clipPath id="clipL"><rect x="1" y="1" width="918" height="248" rx="15"/></clipPath>
    <marker id="arrL" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#afb8c1"/></marker>
    <filter id="shL" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#1f2328" flood-opacity="0.12"/></filter>
    <filter id="glowL" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowRL" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="249" rx="15.5" fill="#f6f8fa" stroke="#d0d7de"/>
  <g clip-path="url(#clipL)"><rect x="1" y="1" width="918" height="248" fill="url(#gridL)"/></g>

  <text class="kick" x="26" y="32">EVENT-DRIVEN · SERVERLESS · AWS</text>

  <text class="edge" x="30" y="86">webhook</text>
  <line class="conn" x1="84" y1="98" x2="118" y2="98" marker-end="url(#arrL)"/>
  <line class="conn" x1="220" y1="98" x2="252" y2="98" marker-end="url(#arrL)"/>
  <line class="conn" x1="356" y1="98" x2="388" y2="98" marker-end="url(#arrL)"/>
  <line class="conn" x1="500" y1="98" x2="700" y2="98" marker-end="url(#arrL)"/>
  <text class="edge" x="600" y="90" text-anchor="middle">crm.deal.update</text>

  <line class="dash" x1="288" y1="124" x2="288" y2="176" marker-end="url(#arrL)"/>
  <text class="cap" x="298" y="156">on erro</text>
  <path class="conn" d="M452 128 L452 176" marker-end="url(#arrL)"/>
  <path class="conn" d="M468 122 C520 150 520 150 548 176" marker-end="url(#arrL)"/>

  <!-- evento OK viaja pelo fio (passa POR TRÁS dos nós) -->
  <g class="packet"><circle cx="88" cy="98" r="5" fill="#24292f" filter="url(#glowL)"/></g>

  <g transform="translate(120,74)" filter="url(#shL)">
    <rect class="node an pa" width="100" height="48" rx="10"/>
    <g class="ico" transform="translate(15,15)"><path d="M7 2 L2 9 L7 16"/><path d="M12 2 L17 9 L12 16"/></g>
    <text class="name" x="40" y="29">API GW</text>
  </g>
  <text class="cap" x="170" y="138" text-anchor="middle">HTTP · BEARER</text>

  <g transform="translate(252,74)" filter="url(#shL)">
    <rect class="node an ps" width="104" height="48" rx="10"/>
    <g class="ico" transform="translate(15,15)"><rect x="0" y="1" width="17" height="3.4" rx="1.4"/><rect x="0" y="7" width="17" height="3.4" rx="1.4"/><rect x="0" y="13" width="17" height="3.4" rx="1.4"/></g>
    <text class="name" x="40" y="29">SQS</text>
  </g>
  <text class="cap" x="304" y="138" text-anchor="middle">BATCH · RETRY</text>

  <g transform="translate(388,70)" filter="url(#shL)">
    <rect class="core an pw" width="112" height="56" rx="11"/>
    <g class="icoc" transform="translate(16,19)"><rect x="3" y="3" width="12" height="12" rx="2.5"/><rect x="6.5" y="6.5" width="5" height="5" rx="1"/><path d="M1 7 L3 7 M1 11 L3 11 M15 7 L17 7 M15 11 L17 11"/><path d="M7 1 L7 3 M11 1 L11 3 M7 15 L7 17 M11 15 L11 17"/></g>
    <text class="name" x="42" y="27" fill="#24292f">Worker λ</text>
    <text class="cap" x="42" y="42" fill="#57606a">IDEMPOTENTE</text>
  </g>

  <!-- easter egg: patinho debugando o Worker (rubber duck debugging) -->
  <g transform="translate(470,51)">
    <ellipse cx="9" cy="12" rx="8" ry="5" fill="#f5c542"/>
    <circle cx="4" cy="7" r="4.2" fill="#f5c542"/>
    <path d="M1 6 L-3 7.4 L1 8.8 Z" fill="#e8920f"/>
    <path d="M8 11 q4 -2.5 7.5 -0.5" fill="none" stroke="#caa520" stroke-width="1"/>
    <circle cx="3.2" cy="6" r="0.85" fill="#1b1b1b"/>
  </g>

  <g transform="translate(700,74)" filter="url(#shL)">
    <rect class="node an pc" width="96" height="48" rx="10"/>
    <g class="ico" transform="translate(15,15)"><rect x="1" y="3" width="16" height="13" rx="2"/><circle cx="5.5" cy="8.5" r="2"/><path d="M10 7 L15 7 M10 10.5 L15 10.5 M10 14 L13.5 14"/></g>
    <text class="name" x="40" y="29">CRM</text>
  </g>
  <text class="cap" x="748" y="138" text-anchor="middle">REST API</text>

  <g transform="translate(244,176)" filter="url(#shL)">
    <rect class="node dlqx" width="88" height="40" rx="9"/>
    <g class="ico" transform="translate(12,11)"><rect x="0" y="1" width="13" height="2.6" rx="1"/><rect x="0" y="6" width="13" height="2.6" rx="1"/><rect x="0" y="11" width="13" height="2.6" rx="1"/></g>
    <text class="name2" x="32" y="25">DLQ</text>
  </g>

  <g transform="translate(406,176)" filter="url(#shL)">
    <rect class="node" width="96" height="40" rx="9"/>
    <g class="ico" transform="translate(12,10)"><ellipse cx="8" cy="3" rx="6" ry="2"/><path d="M2 3 L2 15"/><path d="M14 3 L14 15"/><path d="M2 15 A6 2 0 0 0 14 15"/><path d="M2 9 A6 2 0 0 0 14 9"/></g>
    <text class="name2" x="32" y="25">DynamoDB</text>
  </g>
  <g transform="translate(516,176)" filter="url(#shL)">
    <rect class="node" width="72" height="40" rx="9"/>
    <g class="ico" transform="translate(12,10)"><ellipse cx="8" cy="3.5" rx="5.5" ry="1.8"/><path d="M2.5 3.5 L4 16 L12 16 L13.5 3.5"/></g>
    <text class="name2" x="30" y="25">S3</text>
  </g>

  <!-- evento que FALHA: cai na DLQ (vermelho, POR CIMA), badge ✕ estoura, label -->
  <g class="errpkt"><circle cx="288" cy="124" r="5.5" fill="#cf222e" filter="url(#glowRL)"/></g>
  <g transform="translate(330,178)"><g class="errx"><circle r="8" fill="#cf222e"/><path d="M-3 -3 L3 3 M3 -3 L-3 3" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/></g></g>
  <text class="errt errlbl" x="346" y="200">falhou → DLQ → retry</text>

  <text class="cap" x="894" y="234" text-anchor="end" fill="#b9c0c8">oveloso · TypeScript · AWS CDK</text>
</svg>
