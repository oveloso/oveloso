<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" role="img" aria-label="Arquitetura serverless event-driven animada (preto e branco): um evento percorre webhook, API Gateway, fila SQS, Worker Lambda idempotente (DynamoDB, S3) e atualiza o CRM. Parte das mensagens falha e cai na DLQ com erro, depois e reprocessada (retry). Um patinho observa o Worker (rubber duck debugging).">
  <defs>
    <style>
      svg{--bg:#0d1117;--bord:#30363d;--grid:#1b2330;--tx:#c9d1d9;--tx2:#adbac7;--kick:#6e7681;--edge:#768390;--cap:#636c76;--err:#e5534b;--errt:#f1817a;--xcross:#0d1117;--node:#161b22;--core:#1c2128;--cbord:#c9d1d9;--ico:#768390;--icoc:#c9d1d9;--conn:#444c56;--flow:#5c6773;--pkt:#e6edf3;--peak:#c9d1d9;--peakw:#ffffff;--foot:#4d555e;}

      .name {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:var(--tx)}
      .name2{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:var(--tx2)}
      .kick {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9.5px;fill:var(--kick);letter-spacing:2px}
      .edge {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9.5px;fill:var(--edge)}
      .cap  {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;fill:var(--cap);letter-spacing:1px}
      .errt {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;fill:var(--errt);letter-spacing:.5px;font-weight:600}
      .node {fill:var(--node);stroke:var(--bord);stroke-width:1.5}
      .core {fill:var(--core);stroke:var(--cbord);stroke-width:1.6}
      .ico  {fill:none;stroke:var(--ico);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .icoc {fill:none;stroke:var(--icoc);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .conn {fill:none;stroke:var(--conn);stroke-width:1.6}
      .dash {fill:none;stroke:var(--conn);stroke-width:1.4;stroke-dasharray:3 4}
      .arrf {fill:var(--conn)}
      .flow {fill:none;stroke:var(--flow);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:0.01 15;stroke-opacity:.5;animation:flowf 1.15s linear infinite}

      .an {animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
      .pa {animation-name:ka} .ps {animation-name:ks} .pw {animation-name:kw} .pc {animation-name:kc}
      @keyframes ka {0%,6%{stroke:var(--bord)}12%{stroke:var(--peak)}20%,100%{stroke:var(--bord)}}
      @keyframes ks {0%,27%{stroke:var(--bord)}33%{stroke:var(--peak)}41%,100%{stroke:var(--bord)}}
      @keyframes kw {0%,48%{stroke:var(--cbord)}54%{stroke:var(--peakw)}62%,100%{stroke:var(--cbord)}}
      @keyframes kc {0%,90%{stroke:var(--bord)}96%{stroke:var(--peak)}100%{stroke:var(--bord)}}

      .packet {animation:travel 6s ease-in-out infinite}
      @keyframes travel {0%{transform:translate(0,0);opacity:0}7%{opacity:1}93%{opacity:1}100%{transform:translate(660px,0);opacity:0}}

      .pulse {fill:none;stroke:var(--peakw);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}
      @keyframes pulse {0%,48%{opacity:0;transform:scale(.8)}54%{opacity:.5;transform:scale(1)}63%{opacity:0;transform:scale(2)}100%{opacity:0;transform:scale(2)}}

      .duck {animation:bob 2.8s ease-in-out infinite}
      @keyframes bob {0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

      .errpkt {animation:errdrop 6s ease-in-out infinite}
      @keyframes errdrop {0%,54%{opacity:0;transform:translate(0,0)}59%{opacity:1;transform:translate(0,0)}76%{opacity:1;transform:translate(0,50px)}90%{opacity:1;transform:translate(0,50px)}96%,100%{opacity:0;transform:translate(0,50px)}}
      .errx {animation:errpop 6s ease-in-out infinite}
      @keyframes errpop {0%,74%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1)}92%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
      .errlbl {animation:errshow 6s ease-in-out infinite}
      @keyframes errshow {0%,76%{opacity:0}82%{opacity:1}93%,100%{opacity:0}}
      .dlqx {animation:dlqflash 6s ease-in-out infinite}
      @keyframes dlqflash {0%,74%{stroke:var(--bord)}82%{stroke:var(--err)}93%,100%{stroke:var(--bord)}}

      .retrypkt {animation:retry 6s ease-in-out infinite}
      @keyframes retry {0%,84%{opacity:0;transform:translate(0,0)}88%{opacity:.95}99%{opacity:.95;transform:translate(0,-48px)}100%{opacity:0;transform:translate(0,-48px)}}

      @keyframes flowf {from{stroke-dashoffset:15}to{stroke-dashoffset:0}}

      @media (prefers-reduced-motion: reduce){
        .an,.packet,.errpkt,.errx,.errlbl,.dlqx,.flow,.pulse,.duck,.retrypkt{animation:none!important}
        .packet,.errpkt,.errx,.errlbl,.retrypkt,.pulse{opacity:0!important}
      }
    </style>
    <pattern id="grid" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.9" style="fill:var(--grid)"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="918" height="248" rx="15"/></clipPath>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path class="arrf" d="M0 0 L6 3 L0 6 Z"/></marker>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--pkt);stop-opacity:0"/>
      <stop offset="1" style="stop-color:var(--pkt);stop-opacity:.85"/>
    </linearGradient>
    <linearGradient id="rtail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" style="stop-color:var(--err);stop-opacity:0"/>
      <stop offset="1" style="stop-color:var(--err);stop-opacity:.8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45"/></filter>
    <filter id="glow" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowr" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="249" rx="15.5" style="fill:var(--bg);stroke:var(--bord);stroke-width:1"/>
  <g clip-path="url(#clip)"><rect x="1" y="1" width="918" height="248" fill="url(#grid)"/></g>

  <text class="kick" x="26" y="32">EVENT-DRIVEN · SERVERLESS · AWS</text>

  <text class="edge" x="30" y="86">webhook</text>
  <line class="conn" x1="84"  y1="98" x2="118" y2="98" marker-end="url(#arr)"/>
  <line class="conn" x1="220" y1="98" x2="252" y2="98" marker-end="url(#arr)"/>
  <line class="conn" x1="356" y1="98" x2="388" y2="98" marker-end="url(#arr)"/>
  <line class="conn" x1="500" y1="98" x2="700" y2="98" marker-end="url(#arr)"/>
  <text class="edge" x="600" y="90" text-anchor="middle">crm.deal.update</text>

  <!-- fluxo ambiente: pontinhos deslizam pelos fios (sensacao de "live") -->
  <line class="flow" x1="84"  y1="98" x2="118" y2="98"/>
  <line class="flow" x1="220" y1="98" x2="252" y2="98"/>
  <line class="flow" x1="356" y1="98" x2="388" y2="98"/>
  <line class="flow" x1="500" y1="98" x2="700" y2="98"/>

  <!-- ciclo da DLQ: desce on-erro, sobe no retry -->
  <line class="dash" x1="288" y1="124" x2="288" y2="176" marker-end="url(#arr)"/>
  <text class="cap" x="281" y="153" text-anchor="end">on error</text>
  <line class="dash" x1="312" y1="176" x2="312" y2="124" marker-end="url(#arr)"/>
  <text class="cap" x="319" y="153">retry</text>

  <path class="conn" d="M452 128 L452 176" marker-end="url(#arr)"/>
  <path class="conn" d="M468 122 C520 150 520 150 548 176" marker-end="url(#arr)"/>

  <!-- ping do Worker (anel que emana) -->
  <circle class="pulse" cx="444" cy="98" r="34"/>

  <!-- evento OK viaja pelo fio com rastro (passa POR TRAS dos nos) -->
  <g class="packet">
    <rect x="60" y="95.5" width="28" height="5" rx="2.5" fill="url(#tail)"/>
    <circle cx="88" cy="98" r="5" style="fill:var(--pkt)" filter="url(#glow)"/>
  </g>

  <g transform="translate(120,74)" filter="url(#sh)">
    <rect class="node an pa" width="100" height="48" rx="10"/>
    <g class="ico" transform="translate(15,15)"><path d="M7 2 L2 9 L7 16"/><path d="M12 2 L17 9 L12 16"/></g>
    <text class="name" x="40" y="29">API GW</text>
  </g>
  <text class="cap" x="170" y="138" text-anchor="middle">HTTP · BEARER</text>

  <g transform="translate(252,74)" filter="url(#sh)">
    <rect class="node an ps" width="104" height="48" rx="10"/>
    <g class="ico" transform="translate(15,15)"><rect x="0" y="1" width="17" height="3.4" rx="1.4"/><rect x="0" y="7" width="17" height="3.4" rx="1.4"/><rect x="0" y="13" width="17" height="3.4" rx="1.4"/></g>
    <text class="name" x="40" y="29">SQS</text>
  </g>
  <text class="cap" x="304" y="138" text-anchor="middle">BATCH · RETRY</text>

  <g transform="translate(388,70)" filter="url(#sh)">
    <rect class="core an pw" width="112" height="56" rx="11"/>
    <g class="icoc" transform="translate(16,19)"><rect x="3" y="3" width="12" height="12" rx="2.5"/><rect x="6.5" y="6.5" width="5" height="5" rx="1"/><path d="M1 7 L3 7 M1 11 L3 11 M15 7 L17 7 M15 11 L17 11"/><path d="M7 1 L7 3 M11 1 L11 3 M7 15 L7 17 M11 15 L11 17"/></g>
    <text class="name" x="42" y="27" style="fill:var(--icoc)">Worker λ</text>
    <text class="cap" x="42" y="42" style="fill:var(--edge)">IDEMPOTENTE</text>
  </g>

  <!-- easter egg: patinho debugando o Worker (rubber duck debugging) -->
  <g transform="translate(470,51)">
    <g class="duck">
      <ellipse cx="9" cy="12" rx="8" ry="5" fill="#f5c542"/>
      <circle cx="4" cy="7" r="4.2" fill="#f5c542"/>
      <path d="M1 6 L-3 7.4 L1 8.8 Z" fill="#e8920f"/>
      <path d="M8 11 q4 -2.5 7.5 -0.5" fill="none" stroke="#c79a1f" stroke-width="1"/>
      <circle cx="3.2" cy="6" r="0.85" fill="#1b1b1b"/>
    </g>
  </g>

  <g transform="translate(700,74)" filter="url(#sh)">
    <rect class="node an pc" width="96" height="48" rx="10"/>
    <g class="ico" transform="translate(15,15)"><rect x="1" y="3" width="16" height="13" rx="2"/><circle cx="5.5" cy="8.5" r="2"/><path d="M10 7 L15 7 M10 10.5 L15 10.5 M10 14 L13.5 14"/></g>
    <text class="name" x="40" y="29">CRM</text>
  </g>
  <text class="cap" x="748" y="138" text-anchor="middle">REST API</text>

  <g transform="translate(244,176)" filter="url(#sh)">
    <rect class="node dlqx" width="88" height="40" rx="9"/>
    <g class="ico" transform="translate(12,11)"><rect x="0" y="1" width="13" height="2.6" rx="1"/><rect x="0" y="6" width="13" height="2.6" rx="1"/><rect x="0" y="11" width="13" height="2.6" rx="1"/></g>
    <text class="name2" x="32" y="25">DLQ</text>
  </g>

  <g transform="translate(406,176)" filter="url(#sh)">
    <rect class="node" width="96" height="40" rx="9"/>
    <g class="ico" transform="translate(12,10)"><ellipse cx="8" cy="3" rx="6" ry="2"/><path d="M2 3 L2 15"/><path d="M14 3 L14 15"/><path d="M2 15 A6 2 0 0 0 14 15"/><path d="M2 9 A6 2 0 0 0 14 9"/></g>
    <text class="name2" x="32" y="25">DynamoDB</text>
  </g>
  <g transform="translate(516,176)" filter="url(#sh)">
    <rect class="node" width="72" height="40" rx="9"/>
    <g class="ico" transform="translate(12,10)"><ellipse cx="8" cy="3.5" rx="5.5" ry="1.8"/><path d="M2.5 3.5 L4 16 L12 16 L13.5 3.5"/></g>
    <text class="name2" x="30" y="25">S3</text>
  </g>

  <!-- evento que FALHA: cai na DLQ (vermelho, POR CIMA), badge x estoura, label -->
  <g class="errpkt">
    <rect x="285" y="100" width="6" height="22" rx="3" fill="url(#rtail)"/>
    <circle cx="288" cy="124" r="5.5" style="fill:var(--err)" filter="url(#glowr)"/>
  </g>
  <g transform="translate(330,178)"><g class="errx"><circle r="8" style="fill:var(--err)"/><path d="M-3 -3 L3 3 M3 -3 L-3 3" fill="none" style="stroke:var(--xcross)" stroke-width="1.8" stroke-linecap="round"/></g></g>
  <text class="errt errlbl" x="288" y="234" text-anchor="middle">falhou → retry</text>

  <!-- reprocessamento: msg volta da DLQ para a fila -->
  <g class="retrypkt"><circle cx="312" cy="174" r="3.4" style="fill:var(--pkt)"/></g>

  <text class="cap" x="894" y="234" text-anchor="end" style="fill:var(--foot)">oveloso · TypeScript · AWS CDK</text>
</svg>
