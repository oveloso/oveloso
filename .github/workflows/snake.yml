name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gera a cobra (paleta âmbar — identidade do perfil)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#fef3c7,#fde68a,#fcd34d,#f59e0b,#b45309
            dist/github-snake-dark.svg?color_snake=#a78bfa&color_dots=#2a2007,#6b4f0a,#a3760c,#d99e0b,#ffd23f

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
